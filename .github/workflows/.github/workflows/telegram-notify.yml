
name: CHU Bingo Telegram Notifications

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Firebase Admin
        run: npm install firebase-admin

      - name: Check games and notify Telegram
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node <<'NODE'
          const admin = require("firebase-admin");

          async function main() {
            for (const name of [
              "FIREBASE_SERVICE_ACCOUNT",
              "TELEGRAM_BOT_TOKEN",
              "TELEGRAM_CHAT_ID"
            ]) {
              if (!process.env[name]) {
                throw new Error("Missing GitHub secret: " + name);
              }
            }

            const serviceAccount = JSON.parse(
              process.env.FIREBASE_SERVICE_ACCOUNT
            );

            admin.initializeApp({
              credential: admin.credential.cert(serviceAccount),
              projectId: "chubingo"
            });

            const db = admin.firestore();

            async function notifyOnce(id, message) {
              const state = db.collection("telegramNotifications").doc(id);
              const existing = await state.get();

              if (existing.exists) return;

              const response = await fetch(
                `https://api.telegram.org/bot${process.env.TELEGRAM_BOT_TOKEN}/sendMessage`,
                {
                  method: "POST",
                  headers: {
                    "Content-Type": "application/json"
                  },
                  body: JSON.stringify({
                    chat_id: process.env.TELEGRAM_CHAT_ID,
                    text: message
                  })
                }
              );

              const result = await response.json();

              if (!response.ok || !result.ok) {
                throw new Error("Telegram message failed: " +
                  JSON.stringify(result));
              }

              await state.create({
                sentAt: admin.firestore.FieldValue.serverTimestamp()
              });
            }

            const rooms = await db.collection("rooms").get();

            for (const roomDoc of rooms.docs) {
              const room = roomDoc.data();
              const roomId = roomDoc.id;
              const round = String(room.roundStartedAt || "unknown");

              if (room.gameStarted === true) {
                await notifyOnce(
                  `${roomId}_started_${round}`,
                  `🎱 CHU Bingo: Game started!\nRoom: ${roomId}`
                );
              }

              if (room.gameWon === true && room.winnerUid) {
                const winner = room.winnerName || "Player";

                await notifyOnce(
                  `${roomId}_winner_${round}_${room.winnerUid}`,
                  `🏆 CHU Bingo: We have a winner!\nRoom: ${roomId}\nWinner: ${winner}`
                );
              }
            }

            console.log("Game notification check completed.");
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

