name: CHU Bingo Telegram Notifications

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: chu-bingo-telegram-notifications
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Firebase Admin
        run: npm install firebase-admin

      - name: Check rooms and notify Telegram
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node <<'NODE'
          const admin = require("firebase-admin");

          async function main() {
            for (const name of [
              "FIREBASE_SERVICE_ACCOUNT",
              "TELEGRAM_BOT_TOKEN",
              "TELEGRAM_CHAT_ID"
            ]) {
              if (!process.env[name]) {
                throw new Error("Missing GitHub secret: " + name);
              }
            }

            const serviceAccount = JSON.parse(
              process.env.FIREBASE_SERVICE_ACCOUNT
            );

            admin.initializeApp({
              credential: admin.credential.cert(serviceAccount),
              projectId: "chubingo"
            });

            const db = admin.firestore();
            const notifications = db.collection("telegramNotifications");

            async function notifyOnce(id, message) {
              const ref = notifications.doc(id);
              const existing = await ref.get();

              if (existing.exists) return;

              const response = await fetch(
                `https://api.telegram.org/bot${process.env.TELEGRAM_BOT_TOKEN}/sendMessage`,
                {
                  method: "POST",
                  headers: {
                    "Content-Type": "application/json"
                  },
                  body: JSON.stringify({
                    chat_id: process.env.TELEGRAM_CHAT_ID,
                    text: message
                  })
                }
              );

              const result = await response.json();

              if (!response.ok || !result.ok) {
                throw new Error(
                  "Telegram message failed: " +
                  JSON.stringify(result)
                );
              }

              await ref.create({
                sentAt: admin.firestore.FieldValue.serverTimestamp()
              });
            }

            const rooms = await db.collection("rooms").get();
            const baselineRef = notifications.doc(
              "_room_creation_baseline"
            );
            const baseline = await baselineRef.get();

            if (!baseline.exists) {
              console.log(
                "First run: recording existing rooms without old room alerts."
              );

              for (let i = 0; i < rooms.docs.length; i += 400) {
                const batch = db.batch();

                for (const roomDoc of rooms.docs.slice(i, i + 400)) {
                  batch.set(
                    notifications.doc("room_created_" + roomDoc.id),
                    {
                      baseline: true,
                      recordedAt:
                        admin.firestore.FieldValue.serverTimestamp()
                    },
                    { merge: true }
                  );
                }

                await batch.commit();
              }

              await baselineRef.create({
                initializedAt:
                  admin.firestore.FieldValue.serverTimestamp()
              });

              console.log("Existing rooms recorded.");
            } else {
              for (const roomDoc of rooms.docs) {
                const roomId = roomDoc.id;

                await notifyOnce(
                  "room_created_" + roomId,
                  "🎱 CHU Bingo — New Room Created!\n" +
                  "Room Code: " + roomId + "\n" +
                  "Players can use this code to join."
                );
              }
            }

            for (const roomDoc of rooms.docs) {
              const room = roomDoc.data();
              const roomId = roomDoc.id;
              const round = String(
  room.createdAt?.toMillis?.() || roomDoc.updateTime.toMillis()
);

            if (room.gameStarted === true) {
                await notifyOnce(
                  `${roomId}_started_${round}`,
                  `🎱 CHU Bingo: Game started!\nRoom: ${roomId}`
                );
              }

              if (room.gameWon === true && room.winnerUid) {
                await notifyOnce(
                  `${roomId}_winner_${round}_${room.winnerUid}`,
                  `🏆 CHU Bingo: We have a winner!\n` +
                  `Room: ${roomId}\n` +
                  `Winner: ${room.winnerName || "Player"}`
                );
              }
            }

            console.log("Room and game notification check completed.");
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
