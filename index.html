<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHU Bingo</title>

<style>
body{
  margin:0;
  background:#0b1238;
  color:white;
  font-family:Arial;
  text-align:center;
}

h1{
  background:#11194a;
  padding:20px;
  margin:0;
}

#number{
  font-size:55px;
  color:#ffd32a;
  margin:30px;
  font-weight:bold;
}

button{
  padding:18px 30px;
  margin:8px;
  border:0;
  border-radius:12px;
  font-size:20px;
  font-weight:bold;
}

#call{
  background:#ffd32a;
  color:#111;
}

#reset{
  background:#e74c3c;
  color:white;
}

#history{
  margin:20px;
}

.called{
  display:inline-block;
  background:#292f6b;
  padding:8px 12px;
  margin:4px;
  border-radius:8px;
}

.card{
  max-width:450px;
  margin:20px auto;
  padding:15px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:5px;
}

.cell{
  background:white;
  color:#111;
  padding:15px 5px;
  border-radius:5px;
  font-weight:bold;
}

.head{
  background:#ffd32a;
}

.marked{
  background:#ff4757;
  color:white;
}
</style>
</head>

<body>

<h1>🎱 CHU BINGO</h1>

<div id="number">---</div>

<button id="call">CALL NUMBER</button>
<button id="reset">RESET</button>

<h2>Called Numbers</h2>
<div id="history"></div>

<div class="card">
<h2>Your Bingo Card</h2>

<div class="grid">

<div class="cell head">B</div>
<div class="cell head">I</div>
<div class="cell head">N</div>
<div class="cell head">G</div>
<div class="cell head">O</div>

<div class="cell" data-n="1">1</div>
<div class="cell" data-n="16">16</div>
<div class="cell" data-n="31">31</div>
<div class="cell" data-n="46">46</div>
<div class="cell" data-n="61">61</div>

<div class="cell" data-n="5">5</div>
<div class="cell" data-n="20">20</div>
<div class="cell" data-n="35">35</div>
<div class="cell" data-n="50">50</div>
<div class="cell" data-n="65">65</div>

<div class="cell" data-n="9">9</div>
<div class="cell" data-n="24">24</div>
<div class="cell marked">FREE</div>
<div class="cell" data-n="54">54</div>
<div class="cell" data-n="69">69</div>

<div class="cell" data-n="12">12</div>
<div class="cell" data-n="27">27</div>
<div class="cell" data-n="42">42</div>
<div class="cell" data-n="57">57</div>
<div class="cell" data-n="72">72</div>

<div class="cell" data-n="15">15</div>
<div class="cell" data-n="30">30</div>
<div class="cell" data-n="45">45</div>
<div class="cell" data-n="60">60</div>
<div class="cell" data-n="75">75</div>

</div>
</div>

<script>

var numbers=[];

document.getElementById("call").onclick=function(){

  if(numbers.length==75){
    alert("All numbers have been called!");
    return;
  }

  var n;

  do{
    n=Math.floor(Math.random()*75)+1;
  }while(numbers.indexOf(n)!=-1);

  numbers.push(n);

  var letter;

  if(n<=15) letter="B";
  else if(n<=30) letter="I";
  else if(n<=45) letter="N";
  else if(n<=60) letter="G";
  else letter="O";

  document.getElementById("number").innerHTML=letter+"-"+n;

  var item=document.createElement("span");
  item.className="called";
  item.innerHTML=letter+"-"+n;

  document.getElementById("history").prepend(item);

  var cell=document.querySelector('[data-n="'+n+'"]');

  if(cell){
    cell.classList.add("marked");
  }

};

document.getElementById("reset").onclick=function(){

  numbers=[];

  document.getElementById("number").innerHTML="---";

  document.getElementById("history").innerHTML="";

  document.querySelectorAll(".marked").forEach(function(cell){

    if(cell.innerHTML!="FREE"){
      cell.classList.remove("marked");
    }

  });

};

</script>

</body>
</html>
