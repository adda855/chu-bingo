<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHU Bingo</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#0b1238;color:#fff;text-align:center}
header{background:#11194a;padding:18px;font-size:30px;font-weight:bold}
.container{max-width:500px;margin:auto;padding:20px}
.player,.history{background:#171f59;padding:18px;border-radius:15px;margin-bottom:20px}
input{width:100%;padding:15px;margin-top:12px;border:0;border-radius:10px;font-size:18px}
.called-box{background:#2912a8;padding:25px;border-radius:18px;margin:20px 0}
.called-title{font-size:17px}
.called-number{font-size:58px;font-weight:bold;margin-top:8px}
button{width:100%;padding:17px;margin-top:15px;border:0;border-radius:12px;background:#ffd32a;color:#111;font-size:19px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}
.history-list{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin-top:12px}
.history-list span{background:#333b78;padding:8px 11px;border-radius:7px}
.card-number{font-size:18px;font-weight:bold;margin:12px 0}
.bingo-card{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;margin-top:12px}
.cell{background:white;color:#111;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:clamp(14px,4vw,20px);font-weight:bold;border-radius:6px;min-width:0}
.head{background:#ffd32a}
.marked{background:#20d46b!important;color:white!important}
.free{background:#ff8c00;color:white}
.status{margin-top:18px;font-size:20px;font-weight:bold;min-height:25px}
.win-screen{display:none;position:fixed;inset:0;background:#0b1238;z-index:1000;align-items:center;justify-content:center;padding:25px}
.win-box{width:100%;max-width:430px;background:#171f59;padding:35px 25px;border-radius:25px;box-shadow:0 0 30px rgba(0,0,0,.5)}
.win-title{font-size:52px;font-weight:bold;margin-bottom:15px}
.win-name{font-size:27px;margin:15px 0}
.win-calls{font-size:19px;margin-bottom:20px}
</style>
</head>
<body>
<header>🎱 CHU BINGO</header>
<div class="container">
  <div class="player">
    <div>Player Name</div>
    <input id="playerName" type="text" placeholder="Enter your name" autocomplete="name">
  </div>
  <div id="cardNumber" class="card-number">CARD NUMBER: —</div>
  <div class="called-box">
    <div class="called-title">CURRENT CALL</div>
    <div id="calledNumber" class="called-number">---</div>
  </div>
  <button id="callButton" type="button" onclick="callNumber()">📢 CALL NUMBER</button>
  <div class="history">
    <div>Called Numbers</div>
    <div id="historyList" class="history-list">No numbers called yet</div>
  </div>
  <h2>Your Bingo Card</h2>
  <div id="bingoCard" class="bingo-card" aria-label="Bingo card"></div>
  <div id="status" class="status" role="status" aria-live="polite"></div>
  <button type="button" onclick="newCard()">🔄 NEW CARD</button>
</div>
<div id="winScreen" class="win-screen">
  <div class="win-box">
    <div class="win-title">🎉 BINGO!</div>
    <div id="winName" class="win-name">Congratulations!</div>
    <div id="winCalls" class="win-calls">You won the game!</div>
    <button type="button" onclick="playAgain()">🔄 PLAY AGAIN</button>
  </div>
</div>
<script>
"use strict";
let calledNumbers = [];
let cardNumbers = [];
let gameWon = false;

function randomNumber(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function generateBingoCard() {
  const card = document.getElementById("bingoCard");
  card.innerHTML = "";
  cardNumbers = [];

  ["B", "I", "N", "G", "O"].forEach(letter => {
    const heading = document.createElement("div");
    heading.className = "cell head";
    heading.textContent = letter;
    card.appendChild(heading);
  });

  const ranges = [[1,15],[16,30],[31,45],[46,60],[61,75]];
  const columns = ranges.map(([min,max]) => {
    const nums = [];
    while (nums.length < 5) {
      const n = randomNumber(min,max);
      if (!nums.includes(n)) nums.push(n);
    }
    return nums;
  });

  for (let row = 0; row < 5; row++) {
    for (let col = 0; col < 5; col++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      if (row === 2 && col === 2) {
        cell.textContent = "FREE";
        cell.classList.add("free", "marked");
        cell.dataset.number = "FREE";
      } else {
        const n = columns[col][row];
        cell.textContent = n;
        cell.dataset.number = String(n);
        cardNumbers.push(n);
      }
      card.appendChild(cell);
    }
  }
  document.getElementById("cardNumber").textContent =
    "CARD NUMBER: " + randomNumber(100000, 999999);
}

function callNumber() {
  if (gameWon) return;
  if (calledNumbers.length >= 75) {
    document.getElementById("status").textContent = "All numbers have been called.";
    document.getElementById("callButton").disabled = true;
    return;
  }
  let number;
  do { number = randomNumber(1,75); }
  while (calledNumbers.includes(number));
  calledNumbers.push(number);

  const letter = number <= 15 ? "B" : number <= 30 ? "I" :
                 number <= 45 ? "N" : number <= 60 ? "G" : "O";
  document.getElementById("calledNumber").textContent = letter + " " + number;
  const history = document.getElementById("historyList");
  history.innerHTML = "";
  calledNumbers.forEach(n => {
    const chip = document.createElement("span");
    const l = n <= 15 ? "B" : n <= 30 ? "I" : n <= 45 ? "N" : n <= 60 ? "G" : "O";
    chip.textContent = l + " " + n;
    history.appendChild(chip);
  });

  markNumber(number);
  document.getElementById("status").textContent = letter + " " + number + " was called!";
  if (!checkWin() && calledNumbers.length >= 75) {
    document.getElementById("status").textContent = "All numbers have been called.";
    document.getElementById("callButton").disabled = true;
  }
  if ("speechSynthesis" in window) {
    window.speechSynthesis.cancel();
    const speech = new SpeechSynthesisUtterance(letter + " " + number);
    speech.rate = 0.9;
    window.speechSynthesis.speak(speech);
  }
}

function markNumber(number) {
  document.querySelectorAll("#bingoCard .cell[data-number]").forEach(cell => {
    if (cell.dataset.number === String(number)) cell.classList.add("marked");
  });
}

function checkWin() {
  const cells = Array.from(document.querySelectorAll("#bingoCard .cell")).slice(5);
  if (cells.length !== 25) return false;
  const marked = i => cells[i].classList.contains("marked");

  for (let r = 0; r < 5; r++) {
    if ([0,1,2,3,4].every(c => marked(r*5+c))) return showWin();
  }
  for (let c = 0; c < 5; c++) {
    if ([0,1,2,3,4].every(r => marked(r*5+c))) return showWin();
  }
  if ([0,1,2,3,4].every(i => marked(i*5+i))) return showWin();
  if ([0,1,2,3,4].every(i => marked(i*5+(4-i)))) return showWin();
  return false;
}

function showWin() {
  if (gameWon) return true;
  gameWon = true;
  document.getElementById("callButton").disabled = true;
  const name = document.getElementById("playerName").value.trim() || "Player";
  document.getElementById("winName").textContent = "🎉 " + name + " BINGO!";
  document.getElementById("winCalls").textContent =
    "You won after " + calledNumbers.length + " numbers were called!";
  document.getElementById("status").textContent = "🎉 BINGO! Congratulations!";
  document.getElementById("winScreen").style.display = "flex";
  return true;
}

function newCard() {
  calledNumbers = [];
  gameWon = false;
  document.getElementById("calledNumber").textContent = "---";
  document.getElementById("historyList").textContent = "No numbers called yet";
  document.getElementById("status").textContent = "";
  document.getElementById("callButton").disabled = false;
  document.getElementById("winScreen").style.display = "none";
  if ("speechSynthesis" in window) window.speechSynthesis.cancel();
  generateBingoCard();
}

function playAgain() {
  newCard();
}

window.addEventListener("DOMContentLoaded", newCard);
</script>
</body>
</html>
