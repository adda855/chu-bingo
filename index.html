}

input{
  width:100%;

}

.called-box{
  background:#2912a8;

}

.called-title{

}

button{

}

.history-list{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:7px;

}

.history-list span{

  border-radius:7px;
}

.bingo-card{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:5px;
  margin-top:20px;
}

.cell{
  background:white;
  color:#111;
  aspect-ratio:1;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  font-weight:bold;
  border-radius:6px;
}

.head{
  background:#ffd32a;
}

.marked{
  background:#20d46b;
  color:white;
}

.free{
  background:#ff8c00;
  color:white;
}

.status{
  margin-top:18px;
  font-size:20px;
  font-weight:bold;
}

/* WIN SCREEN */
.win-screen{
  display:none;
  position:fixed;
  inset:0;
  background:#0b1238;
  z-index:1000;
  align-items:center;
  justify-content:center;
  padding:25px;
}

.win-box{
  width:100%;
  max-width:430px;
  background:#171f59;
  padding:35px 25px;
  border-radius:25px;

}

.win-title{
  font-size:60px;
  font-weight:bold;
  margin-bottom:15px;
}

.win-name{
  font-size:27px;

<body>

<header>🎱 CHU BINGO</header>

<div class="container">

  <div class="player">
    <div>Player Name</div>
    <input id="playerName" type="text" placeholder="Enter your name">
  </div>

  <div class="called-box">
    <div class="called-title">CURRENT CALL</div>
    <div id="calledNumber" class="called-number">---</div>
  </div>

  <button id="callButton" onclick="callNumber()">
    📢 CALL NUMBER
  </button>

  <div class="history">
    <div>Called Numbers</div>
    <div id="historyList" class="history-list">
      No numbers called yet
    </div>
  </div>

  <h2>Your Bingo Card</h2>

  <div id="bingoCard" class="bingo-card"></div>

  <div id="status" class="status"></div>

  <button onclick="newCard()">🔄 NEW CARD</button>

</div>

<!-- WIN SCREEN -->

<div id="winScreen" class="win-screen">

  <div class="win-box">

    <div class="win-title">🎉 BINGO!</div>

    <div id="winName" class="win-name">
      Congratulations!
    </div>

    <div id="winCalls" class="win-calls">
      You won the game!
    </div>

    <button onclick="playAgain()">
      🔄 PLAY AGAIN
    </button>

  </div>

</div>

<script>

let calledNumbers = [];
let cardNumbers = [];
let gameWon = false;


/* RANDOM NUMBER */
function randomNumber(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
}


/* CALL NUMBER */
function callNumber() {

    if (gameWon) {
        return;
    }

    if (calledNumbers.length >= 75) {
        document.getElementById("status").textContent =
            "All numbers have been called.";
        return;
    }

    let number;

    do {
        number = randomNumber(1, 75);
    } while (calledNumbers.includes(number));

    calledNumbers.push(number);

    document.getElementById("calledNumber").textContent = number;

    document.getElementById("historyList").textContent =
        calledNumbers.join(" • ");

    document.getElementById("status").textContent =
        "Number " + number + " was called!";

    markNumber(number);

 (checkWin)    
  }
/* MARK NUMBER ON CARD */
function markCalledCell(number) {

    let cells = document.querySelectorAll (".cell");

    cells.forEach(function(cell) {

        if (Number(cell.dataset.number) === number) {

            cell.classList.add("called");

            cell.style.background = "#ffd32a";
            cell.style.color = "#000";
            cell.style.fontWeight = "bold";
        } 

    });
}


/* CREATE NEW CARD */
function newCard() {

    calledNumbers = [];
    cardNumbers = [];
    gameWon = false;

    document.getElementById("calledNumber").textContent = "-";

    document.getElementById("historyList").textContent =
        "No numbers called yet";

    document.getElementById("status").textContent =
        "New Bingo card ready!";

    document.getElementById("winScreen").style.display = "none";

    let card = document.getElementById("bingoCard");

    card.innerHTML = "";

    let letters = ["B", "I", "N", "G", "O"];

    /* HEADERS */
    for (let i = 0; i < 5; i++) {

        let cell = document.createElement("div");

        cell.className = "cell head";

        cell.textContent = letters[i];

        card.appendChild(cell);
    }


    /* NUMBER RANGES */
    let ranges = [
        [1, 15],
        [16, 30],
        [31, 45],
        [46, 60],
        [61, 75]
    ];


    /* CREATE CARD NUMBERS */
    for (let row = 0; row < 5; row++) {

        for (let column = 0; column < 5; column++) {

            let cell = document.createElement("div");

            cell.className = "cell";


            /* FREE SPACE */
            if (row === 2 && column === 2) {

                cell.textContent = "FREE";

                cell.classList.add("free");

                cell.dataset.number = "0";

                cell.classList.add("called");

            }

            else {

                let number;

                do {
                    number = randomNumber(
                        ranges[column][0],
                        ranges[column][1]
                    );
                }
                while (
                    cardNumbers.includes(number)
                );

                cardNumbers.push(number);

                cell.textContent = number;

                cell.dataset.number = number;


                /* CLICK CARD NUMBER */
                cell.onclick = function() {

                    if (
                        calledNumbers.includes(number)
                    ) {

                        cell.classList.toggle("called");

                        checkWin();

                    }
                    else {

                        document.getElementById("status").textContent =
                            "Wait! Number " +
                            number +
                            " has not been called yet.";

                    }

                };

            }

            card.appendChild(cell);
        }
    }
}


/* CHECK BINGO */
function checkWin() {
 let cells = document.querySelectorAll("#bingoCard .cell");

    if (cells.length < 30) {
        return;
    }


    /* GET PLAYABLE CELLS */

    let board = [];

    for (let row = 0; row < 5; row++) {

        board[row] = [];

        for (let column = 0; column < 5; column++) {

            let index = 6 + (row * 5) + column;

            board[row][column] = cells[index];

        }
    }


    /* CHECK ROWS */

    for (let row = 0; row < 5; row++) {

        let win = true;

        for (let column = 0; column < 5; column++) {

            if (
                !board[row][column].classList.contains("called")
            ) {

                win = false;

            }

        }

        if (win) {
            showWin();
            return;
        }
    }


    /* CHECK COLUMNS */

    for (let column = 0; column < 5; column++) {

        let win = true;

        for (let row = 0; row < 5; row++) {

            if (
                !board[row][column].classList.contains("called")
            ) {

                win = false;

            }

        }

        if (win) {
            showWin();
            return;
        }
    }


    /* CHECK DIAGONAL */

    let diagonal1 = true;

    for (let i = 0; i < 5; i++) {

        if (
            !board[i][i].classList.contains("called")
        ) {

            diagonal1 = false;

        }

    }

    if (diagonal1) {
        showWin();
        return;
    }


    /* CHECK SECOND DIAGONAL */

    let diagonal2 = true;

    for (let i = 0; i < 5; i++) {

        if (
            !board[i][4 - i].classList.contains("called")
        ) {

            diagonal2 = false;

        }

    }

    if (diagonal2) {
        showWin();
        return;
    }

}


/* WIN */
function showWin() {

    if (gameWon) {
        return;
    }

    gameWon = true;

    let playerName =
        document.getElementById("playerName").value;

    if (!playerName) {
        playerName = "Player";
    }

    document.getElementById("winName").textContent =
        "🎉 " + playerName + " BINGO!";

    document.getElementById("winCalls").textContent =
        "You won after " +
        calledNumbers.length +
        " numbers were called!";

    document.getElementById("status").textContent =
        "🎉 BINGO! Congratulations!";

    document.getElementById("winScreen").style.display =
        "flex";
}


/* PLAY AGAIN */
function playAgain() {

    document.getElementById("winScreen").style.display =
        "none";

    newCard();
}


/* START GAME */
window.onload = function() {

    newCard();

};
// CALL NUMBER SOUND
document.addEventListener("click", function(e) {
  const button = e.target.closest("button");

  if (!button) return;

  if (button.innerText.includes("CALL NUMBER")) {
    setTimeout(function() {
      const text = document.body.innerText;
      const match = text.match(/Number\s+(\d+)\s+was called!/);

      if (match) {
        const number = match[1];

        window.speechSynthesis.cancel();

        const speech = new SpeechSynthesisUtterance(
          "Number " + number
        );

        speech.lang = "en-US";
        speech.rate = 0.9;
        speech.pitch = 1;

        window.speechSynthesis.speak(speech);
      }
    }, 200);
  }
});
</script>
