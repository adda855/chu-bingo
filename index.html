```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHU Bingo</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0b1238;
  color:white;
  text-align:center;
}

header{
  background:#11194a;
  padding:18px;
  font-size:28px;
  font-weight:bold;
}

.container{
  max-width:500px;
  margin:auto;
  padding:20px;
}

.card{
  background:#171f55;
  border-radius:15px;
  padding:20px;
  margin-top:20px;
}

h1{
  margin-top:5px;
}

#calledNumber{
  font-size:55px;
  font-weight:bold;
  color:#ffd32a;
  margin:20px 0;
  min-height:70px;
}

button{
  border:0;
  border-radius:12px;
  padding:15px 25px;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
  margin:8px;
}

.call{
  background:#ffd32a;
  color:#111;
}

.reset{
  background:#e74c3c;
  color:white;
}

.history{
  margin-top:20px;
  text-align:left;
}

.history-title{
  font-size:20px;
  font-weight:bold;
  margin-bottom:10px;
}

#history{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.number{
  background:#292f6b;
  padding:8px 12px;
  border-radius:8px;
  font-weight:bold;
}

.bingo-card{
  margin-top:25px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:5px;
  margin-top:10px;
}

.cell{
  background:white;
  color:#111;
  padding:12px 2px;
  border-radius:5px;
  font-weight:bold;
  min-height:45px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.head{
  background:#ffd32a;
}

.free{
  background:#55efc4;
}
</style>
</head>

<body>

<header>🎱 CHU BINGO</header>

<div class="container">

<div class="card">
<h1>Calling Number</h1>

<div id="calledNumber">---</div>

<button class="call" onclick="callNumber()">CALL NUMBER</button>
<button class="reset" onclick="resetGame()">RESET</button>

<div class="history">
<div class="history-title">Called Numbers</div>
<div id="history"></div>
</div>
</div>

<div class="card bingo-card">
<h2>Your Bingo Card</h2>

<div class="grid">
<div class="cell head">B</div>
<div class="cell head">I</div>
<div class="cell head">N</div>
<div class="cell head">G</div>
<div class="cell head">O</div>

<div class="cell">1</div>
<div class="cell">16</div>
<div class="cell">31</div>
<div class="cell">46</div>
<div class="cell">61</div>

<div class="cell">5</div>
<div class="cell">20</div>
<div class="cell">35</div>
<div class="cell">50</div>
<div class="cell">65</div>

<div class="cell">9</div>
<div class="cell">24</div>
<div class="cell free">FREE</div>
<div class="cell">54</div>
<div class="cell">69</div>

<div class="cell">12</div>
<div class="cell">27</div>
<div class="cell">42</div>
<div class="cell">57</div>
<div class="cell">72</div>

<div class="cell">15</div>
<div class="cell">30</div>
<div class="cell">45</div>
<div class="cell">60</div>
<div class="cell">75</div>
</div>
</div>

</div>

<script>
let calledNumbers = [];

function callNumber(){

  if(calledNumbers.length >= 75){
    alert("All 75 numbers have been called!");
    return;
  }

  let number;

  do{
    number = Math.floor(Math.random() * 75) + 1;
  }while(calledNumbers.includes(number));

  calledNumbers.push(number);

  let letter;

  if(number <= 15){
    letter = "B";
  }else if(number <= 30){
    letter = "I";
  }else if(number <= 45){
    letter = "N";
  }else if(number <= 60){
    letter = "G";
  }else{
    letter = "O";
  }

  document.getElementById("calledNumber").textContent =
    letter + "-" + number;

  let item = document.createElement("div");
  item.className = "number";
  item.textContent = letter + "-" + number;

  document.getElementById("history").prepend(item);
}

function resetGame(){
  calledNumbers = [];
  document.getElementById("calledNumber").textContent = "---";
  document.getElementById("history").innerHTML = "";
}
</script>

</body>
</html>
