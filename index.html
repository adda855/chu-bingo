```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHU Bingo</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#08122b;
  color:white;
  text-align:center;
}

header{
  padding:18px;
  background:#111d42;
  font-size:28px;
  font-weight:bold;
}

.container{
  max-width:500px;
  margin:auto;
  padding:20px;
}

.balance{
  background:#172653;
  padding:15px;
  border-radius:12px;
  margin-bottom:20px;
}

.balance span{
  color:#ffd32a;
  font-size:22px;
  font-weight:bold;
}

.current{
  background:#24136b;
  border-radius:16px;
  padding:20px;
  margin-bottom:20px;
}

.current-title{
  font-size:16px;
  margin-bottom:8px;
}

.number{
  font-size:60px;
  font-weight:bold;
  color:#ffd32a;
}

.card{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
  margin-top:20px;
}

.cell{
  background:white;
  color:#111;
  aspect-ratio:1;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  font-weight:bold;
  border-radius:6px;
}

.cell.header{
  background:#ffd32a;
  color:#111;
}

.cell.marked{
  background:#35d07f;
  color:white;
}

button{
  width:100%;
  border:0;
  padding:15px;
  margin-top:20px;
  border-radius:10px;
  background:#ffd32a;
  color:#111;
  font-size:18px;
  font-weight:bold;
}

button:active{
  transform:scale(.98);
}

.message{
  margin-top:15px;
  min-height:24px;
  font-weight:bold;
}
</style>
</head>

<body>

<header>CHU BINGO</header>

<div class="container">

  <div class="balance">
    Demo Balance:
    <span>500 ETB</span>
  </div>

  <div class="current">
    <div class="current-title">CURRENT NUMBER</div>
    <div class="number" id="currentNumber">--</div>
  </div>

  <div class="card" id="bingoCard"></div>

  <button onclick="callNumber()">CALL NUMBER</button>

  <button onclick="checkBingo()">CHECK BINGO</button>

  <div class="message" id="message"></div>

</div>

<script>
const card = document.getElementById("bingoCard");
const currentNumber = document.getElementById("currentNumber");
const message = document.getElementById("message");

let calledNumbers = [];
let playerNumbers = [];

function randomNumbers(min,max,count){
  let numbers = [];

  while(numbers.length < count){
    let n = Math.floor(Math.random()*(max-min+1))+min;
    if(!numbers.includes(n)){
      numbers.push(n);
    }
  }

  return numbers;
}

function createCard(){

  card.innerHTML = "";

  const letters = ["B","I","N","G","O"];

  letters.forEach(letter=>{
    const div = document.createElement("div");
    div.className = "cell header";
    div.textContent = letter;
    card.appendChild(div);
  });

  for(let row=0; row<5; row++){

    for(let col=0; col<5; col++){

      let number;

      if(row === 2 && col === 2){
        number = "FREE";
      }else{

        const min = col*15+1;
        const max = col*15+15;

        let available = randomNumbers(min,max,15);

        do{
          number = available[Math.floor(Math.random()*available.length)];
        }while(playerNumbers.includes(number));

        playerNumbers.push(number);
      }

      const cell = document.createElement("div");
      cell.className = "cell";
      cell.textContent = number;

      if(number === "FREE"){
        cell.classList.add("marked");
      }

      cell.onclick = function(){
        if(number !== "FREE"){
          cell.classList.toggle("marked");
        }
      };

      card.appendChild(cell);
    }
  }
}

function callNumber(){

  if(calledNumbers.length >= 75){
    message.textContent = "All numbers have been called.";
    return;
  }

  let number;

  do{
    number = Math.floor(Math.random()*75)+1;
  }while(calledNumbers.includes(number));

  calledNumbers.push(number);

  currentNumber.textContent = number;

  message.textContent = "Number " + number + " called!";
}

function checkBingo(){

  const cells = document.querySelectorAll(".cell:not(.header)");

  const marked = [];

  cells.forEach(cell=>{
    marked.push(
      cell.classList.contains("marked")
    );
  });

  let win = false;

  for(let r=0;r<5;r++){
    let rowWin = true;

    for(let c=0;c<5;c++){
      if(!marked[r*5+c]){
        rowWin=false;
      }
    }

    if(rowWin) win=true;
  }

  for(let c=0;c<5;c++){
    let colWin = true;

    for(let r=0;r<5;r++){
      if(!marked[r*5+c]){
        colWin=false;
      }
    }

    if(colWin) win=true;
  }

  if(win){
    message.textContent = "🎉 BINGO! You won!";
  }else{
    message.textContent = "No Bingo yet. Keep playing!";
  }
}

createCard();
</script>

</body>
</html>
