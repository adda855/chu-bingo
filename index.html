<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHU Bingo</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0b1238;
  color:white;
  text-align:center;
}

header{
  background:#11194a;
  padding:18px;
  font-size:28px;
  font-weight:bold;
}

.container{
  max-width:500px;
  margin:auto;
  padding:20px;
}

.player{
  background:#171f59;
  padding:15px;
  border-radius:12px;
  margin-bottom:20px;
}

input{
  width:100%;
  padding:13px;
  border:0;
  border-radius:8px;
  margin-top:10px;
  font-size:16px;
}

button{
  width:100%;
  padding:15px;
  margin-top:15px;
  border:0;
  border-radius:10px;
  background:#ffd32a;
  color:#111;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

.called-box{
  background:#2912a8;
  padding:20px;
  border-radius:15px;
  margin:20px 0;
}

.called-title{
  font-size:16px;
}

.called-number{
  font-size:55px;
  font-weight:bold;
  margin-top:8px;
}

.history{
  background:#171f59;
  padding:15px;
  border-radius:12px;
  margin-bottom:20px;
}

.history-list{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:7px;
  margin-top:10px;
}

.history-list span{
  background:#333b78;
  padding:7px 10px;
  border-radius:6px;
}

.bingo-card{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:5px;
  margin-top:20px;
}

.cell{
  background:white;
  color:#111;
  aspect-ratio:1;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  font-weight:bold;
  border-radius:5px;
}

.head{
  background:#ffd32a;
}

.marked{
  background:#20d46b;
  color:white;
}

.free{
  background:#ff8c00;
  color:white;
}

.status{
  margin-top:15px;
  font-size:20px;
  font-weight:bold;
}
</style>
</head>

<body>

<header>🎱 CHU BINGO</header>

<div class="container">

  <div class="player">
    <div>Player Name</div>
    <input id="playerName" type="text" placeholder="Enter your name">
  </div>

  <div class="called-box">
    <div class="called-title">CURRENT CALL</div>
    <div id="calledNumber" class="called-number">---</div>
  </div>

  <button onclick="callNumber()">📢 CALL NUMBER</button>

  <div class="history">
    <div>Called Numbers</div>
    <div id="historyList" class="history-list">
      No numbers called yet
    </div>
  </div>

  <h2>Your Bingo Card</h2>

  <div id="bingoCard" class="bingo-card"></div>

  <div id="status" class="status"></div>

  <button onclick="newCard()">🔄 NEW CARD</button>

</div>

<script>

let calledNumbers = [];
let cardNumbers = [];

/* Generate random number */
function randomNumber(min,max){
  return Math.floor(Math.random()*(max-min+1))+min;
}

/* Create Bingo card */
function newCard(){

  calledNumbers = [];

  document.getElementById("calledNumber").textContent = "---";

  document.getElementById("historyList").innerHTML =
    "No numbers called yet";

  document.getElementById("status").textContent = "";

  cardNumbers = [];

  let ranges = [
    [1,15],
    [16,30],
    [31,45],
    [46,60],
    [61,75]
  ];

  for(let column=0; column<5; column++){

    let numbers=[];

    while(numbers.length<5){

      let n=randomNumber(
        ranges[column][0],
        ranges[column][1]
      );

      if(!numbers.includes(n)){
        numbers.push(n);
      }
    }

    cardNumbers.push(numbers);
  }

  let card=document.getElementById("bingoCard");

  card.innerHTML="";

  let letters=["B","I","N","G","O"];

  for(let i=0;i<5;i++){

    let cell=document.createElement("div");

    cell.className="cell head";

    cell.textContent=letters[i];

    card.appendChild(cell);
  }

  for(let row=0;row<5;row++){

    for(let column=0;column<5;column++){

      let cell=document.createElement("div");

      cell.className="cell";

      if(row===2 && column===2){

        cell.textContent="FREE";

        cell.classList.add("free");

      }else{

        cell.textContent=cardNumbers[column][row];

        cell.dataset.number=cardNumbers[column][row];

      }

      card.appendChild(cell);
    }
  }
}

/* Call a number */
function callNumber(){

  if(calledNumbers.length>=75){

    alert("All 75 numbers have been called!");

    return;
  }

  let number;

  do{

    number=randomNumber(1,75);

  }while(calledNumbers.includes(number));

  calledNumbers.push(number);

  let letter;

  if(number<=15){
    letter="B";
  }
  else if(number<=30){
    letter="I";
  }
  else if(number<=45){
    letter="N";
  }
  else if(number<=60){
    letter="G";
  }
  else{
    letter="O";
  }

  let fullNumber=letter+"-"+number;

  document.getElementById("calledNumber").textContent=fullNumber;

  updateHistory();

  markNumber(number);

  checkBingo();
}

/* Update history */
function updateHistory(){

  let history=document.getElementById("historyList");

  history.innerHTML="";

  calledNumbers.slice().reverse().forEach(function(number){

    let letter;

    if(number<=15) letter="B";
    else if(number<=30) letter="I";
    else if(number<=45) letter="N";
    else if(number<=60) letter="G";
    else letter="O";

    let item=document.createElement("span");

    item.textContent=letter+"-"+number;

    history.appendChild(item);

  });
}

/* Mark matching card number */
function markNumber(number){

  let cells=document.querySelectorAll(".cell");

  cells.forEach(function(cell){

    if(cell.dataset.number==number){

      cell.classList.add("marked");

    }

  });
}

/* Check Bingo */
function checkBingo(){

  let cells=document.querySelectorAll(".cell");

  let grid=[];

  for(let row=0;row<5;row++){

    grid[row]=[];

    for(let column=0;column<5;column++){

      let index=6 + row*5 + column;

      let cell=cells[index];

      grid[row][column] =
        cell.classList.contains("marked") ||
        (row===2 && column===2);

    }
  }

  for(let row=0;row<5;row++){

    if(grid[row].every(Boolean)){

      bingoWon();

      return;
    }
  }

  for(let column=0;column<5;column++){

    let win=true;

    for(let row=0;row<5;row++){

      if(!grid[row][column]){

        win=false;

      }

    }

    if(win){

      bingoWon();

      return;
    }
  }

  let diagonal1=true;
  let diagonal2=true;

  for(let i=0;i<5;i++){

    if(!grid[i][i]){
      diagonal1=false;
    }

    if(!grid[i][4-i]){
      diagonal2=false;
    }

  }

  if(diagonal1 || diagonal2){

    bingoWon();

  }
}

/* Bingo winner */
function bingoWon(){

  let name=document.getElementById("playerName").value;

  if(name.trim()===""){
    name="Player";
  }

  document.getElementById("status").textContent =
    "🎉 BINGO! Congratulations "+name+"!";

}

/* Start with a card */
newCard();

</script>

</body>
</html>
