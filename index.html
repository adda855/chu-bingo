}

.container{

  padding:20px;
}

.player,.history{
  background:#171f59;
  padding:18px;
  border-radius:15px;
  margin-bottom:20px;
}

input{
  width:100%;
  padding:15px;
  margin-top:12px;
  border:0;
  border-radius:10px;
  font-size:18px;
}

.called-box{
  background:#2912a8;
  padding:25px;
  border-radius:18px;
  margin:20px 0;
}

.called-title{
  font-size:17px;
}

.called-number{
  font-size:58px;
  font-weight:bold;
  margin-top:8px;
}

button{
  width:100%;
  padding:17px;
  margin-top:15px;
  border:0;
  border-radius:12px;
  background:#ffd32a;
  color:#111;
  font-size:19px;
  font-weight:bold;
}

.history-list{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:7px;
  margin-top:12px;
}

.history-list span{
  background:#333b78;
  padding:8px 11px;
  border-radius:7px;
}

.bingo-card{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:5px;
  margin-top:20px;
}

.cell{
  background:white;
  color:#111;
  aspect-ratio:1;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  font-weight:bold;
  border-radius:6px;
}

.head{
  background:#ffd32a;
}

  color:white;
}

.free{

  color:white;
}

.status{
  margin-top:18px;
  font-size:20px;
  font-weight:bold;
}

/* WIN SCREEN */
.win-screen{
  display:none;
  position:fixed;
  inset:0;
  background:#0b1238;
  z-index:1000;
  align-items:center;
  justify-content:center;
  padding:25px;
}

.win-box{
  width:100%;
  max-width:430px;
  background:#171f59;
  padding:35px 25px;
  border-radius:25px;
  box-shadow:0 0 30px rgba(0,0,0,.5);
}

.win-title{
  font-size:60px;
  font-weight:bold;
  margin-bottom:15px;
}

.win-name{
  font-size:27px;
  margin:15px 0;
}

.win-calls{
  font-size:19px;
  margin-bottom:20px;

<body>

<header>🎱 CHU BINGO</header>

<div class="container">

  <div class="player">
    <div>Player Name</div>
    <input id="playerName" type="text" placeholder="Enter your name">
  </div>

  <div class="called-box">
    <div class="called-title">CURRENT CALL</div>
    <div id="calledNumber" class="called-number">---</div>
  </div>

  <button id="callButton" onclick="callNumber()">
    📢 CALL NUMBER
  </button>

  <div class="history">
    <div>Called Numbers</div>
    <div id="historyList" class="history-list">
      No numbers called yet
    </div>
  </div>

  <h2>Your Bingo Card</h2>

  <div id="bingoCard" class="bingo-card"></div>

  <div id="status" class="status"></div>

  <button onclick="newCard()">🔄 NEW CARD</button>

</div>

<!-- WIN SCREEN -->

<div id="winScreen" class="win-screen">

  <div class="win-box">

    <div class="win-title">🎉 BINGO!</div>

    <div id="winName" class="win-name">
      Congratulations!
    </div>

    <div id="winCalls" class="win-calls">
      You won the game!
    </div>

    <button onclick="playAgain()">
      🔄 PLAY AGAIN
    </button>

  </div>

</div>

<script>

let calledNumbers=[];
let cardNumbers=[];
let gameWon=false;

/* RANDOM NUMBER */

function randomNumber(min,max){
  return Math.floor(Math.random()*(max-min+1))+min;
}

/* NEW CARD */

function newCard(){

  calledNumbers=[];
  cardNumbers=[];
  gameWon=false;

  document.getElementById("calledNumber").textContent="---";
  document.getElementById("historyList").innerHTML=
    "No numbers called yet";
  document.getElementById("status").textContent="";

  document.getElementById("callButton").disabled=false;
  document.getElementById("callButton").style.opacity="1";

  let ranges=[
    [1,15],
    [16,30],
    [31,45],
    [46,60],
    [61,75]
  ];

  for(let column=0;column<5;column++){

    let numbers=[];

    while(numbers.length<5){

      let n=randomNumber(
        ranges[column][0],
        ranges[column][1]
      );

      if(!numbers.includes(n)){
        numbers.push(n);
      }
    }

    cardNumbers.push(numbers);
  }

  let card=document.getElementById("bingoCard");
  card.innerHTML="";

  let letters=["B","I","N","G","O"];

  for(let i=0;i<5;i++){

    let cell=document.createElement("div");

    cell.className="cell head";
    cell.textContent=letters[i];

    card.appendChild(cell);
  }

  for(let row=0;row<5;row++){

    for(let column=0;column<5;column++){

      let cell=document.createElement("div");
      cell.className="cell";

      if(row===2 && column===2){

        cell.textContent="FREE";
        cell.classList.add("free");

      }else{

        cell.textContent=cardNumbers[column][row];
        cell.dataset.number=cardNumbers[column][row];

      }

      card.appendChild(cell);
    }
  }
}

/* CALL NUMBER */

function callNumber(){

  if(gameWon)return;

  if(calledNumbers.length>=75){

    alert("All 75 numbers have been called!");
    return;
  }

  let number;

  do{

    number=randomNumber(1,75);

  }while(calledNumbers.includes(number));

  calledNumbers.push(number);

  let letter;

  if(number<=15)letter="B";
  else if(number<=30)letter="I";
  else if(number<=45)letter="N";
  else if(number<=60)letter="G";
  else letter="O";

  let fullNumber=letter+"-"+number;

  document.getElementById("calledNumber").textContent=
    fullNumber;

  updateHistory();

  markNumber(number);

  checkBingo();
}

/* HISTORY */

function updateHistory(){

  let history=document.getElementById("historyList");

  history.innerHTML="";

  calledNumbers.slice().reverse().forEach(function(number){

    let letter;

    if(number<=15)letter="B";
    else if(number<=30)letter="I";
    else if(number<=45)letter="N";
    else if(number<=60)letter="G";
    else letter="O";

    let item=document.createElement("span");

    item.textContent=letter+"-"+number;

    history.appendChild(item);
  });
}

/* MARK NUMBER */

function markNumber(number){

  document.querySelectorAll(".cell").forEach(function(cell){

    if(cell.dataset.number==number){

      cell.classList.add("marked");

    }
  });
}

/* CHECK BINGO */

function checkBingo(){

  let cells=document.querySelectorAll(".cell");
  let grid=[];

  for(let row=0;row<5;row++){

    grid[row]=[];

    for(let column=0;column<5;column++){

      let index=5+(row*5)+column;
      let cell=cells[index];

      grid[row][column]=
        cell.classList.contains("marked") ||
        (row===2 && column===2);
    }
  }

  /* ROWS */

  for(let row=0;row<5;row++){

    if(grid[row].every(Boolean)){

      bingoWon();
      return;
    }
  }

  /* COLUMNS */

  for(let column=0;column<5;column++){

    let win=true;

    for(let row=0;row<5;row++){

      if(!grid[row][column]){
        win=false;
      }
    }

    if(win){

      bingoWon();
      return;
    }
  }

  /* DIAGONALS */

  let diagonal1=true;
  let diagonal2=true;

  for(let i=0;i<5;i++){

    if(!grid[i][i]){
      diagonal1=false;
    }

    if(!grid[i][4-i]){
      diagonal2=false;
    }
  }

  if(diagonal1 || diagonal2){

    bingoWon();
  }
}

/* WIN */

function bingoWon(){

  if(gameWon)return;

  gameWon=true;

  let name=
    document.getElementById("playerName").value.trim();

  if(name===""){
    name="Player";
  }

  document.getElementById("status").textContent=
    "🎉 BINGO!";

  document.getElementById("winName").textContent=
    "Congratulations, "+name+"!";

  document.getElementById("winCalls").textContent=
    "You won after "+calledNumbers.length+" calls.";

  document.getElementById("winScreen").style.display=
    "flex";

  document.getElementById("callButton").disabled=true;
  document.getElementById("callButton").style.opacity=".5";
}

/* PLAY AGAIN */

function playAgain(){

  document.getElementById("winScreen").style.display=
    "none";

  newCard();
}

/* START GAME */

newCard();

</script>
