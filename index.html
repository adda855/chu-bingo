<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHU Bingo</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0b1238;
  color:white;
  min-height:100vh;
}

header{
  background:#11194a;
  padding:18px;
  text-align:center;
  font-size:28px;
  font-weight:bold;
  color:#ffd32a;
}

.container{
  width:100%;
  max-width:600px;
  margin:auto;
  padding:20px;
}

.screen{
  display:none;
}

.screen.active{
  display:block;
}

.card{
  background:#151f55;
  border-radius:25px;
  padding:25px 20px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.3);
}

.ball{
  width:75px;
  height:75px;
  border-radius:50%;
  background:#777;
  color:#111;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:38px;
  font-weight:bold;
  margin:10px auto 20px;
}

h1{
  color:#ffd32a;
  font-size:42px;
  margin:10px 0;
}

h2{
  color:#ffd32a;
}

p{
  color:#cbd3f5;
  font-size:18px;
  line-height:1.5;
}

input{
  width:100%;
  padding:18px;
  border:0;
  border-radius:15px;
  font-size:18px;
  margin:15px 0;
  text-align:center;
}

button{
  width:100%;
  padding:17px;
  border:0;
  border-radius:15px;
  background:#ffd32a;
  color:#111;
  font-size:20px;
  font-weight:bold;
  margin-top:10px;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

.secondary{
  background:#29366d;
  color:white;
}

.dashboard{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  margin-top:20px;
}

.stat{
  background:#1b2862;
  border-radius:18px;
  padding:20px 10px;
  text-align:center;
}

.stat small{
  display:block;
  color:#bfc8ef;
  margin-bottom:8px;
}

.stat strong{
  color:#ffd32a;
  font-size:22px;
}

.game{
  margin-top:20px;
  background:#151f55;
  border-radius:25px;
  padding:20px;
}

.current{
  text-align:center;
  margin-bottom:20px;
}

.current span{
  width:100px;
  height:100px;
  border-radius:50%;
  background:#ffd32a;
  color:#111;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:45px;
  font-weight:bold;
  margin:10px auto;
}

.bingo{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
  margin-top:15px;
}

.cell{
  aspect-ratio:1;
  background:white;
  color:#111;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

.cell.marked{
  background:#ffd32a;
  color:#111;
}

.cell.free{
  background:#8d99c7;
  color:white;
}

.columns{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
  text-align:center;
  font-weight:bold;
  color:#ffd32a;
  margin-bottom:5px;
}

.message{
  min-height:28px;
  color:#ffd32a;
  text-align:center;
  font-weight:bold;
  margin-top:15px;
}

.footer{
  text-align:center;
  color:#8995c9;
  margin:30px 0 10px;
}

@media(max-width:400px){
  h1{
    font-size:36px;
  }

  .container{
    padding:12px;
  }

  .cell{
    font-size:15px;
  }
}
</style>
</head>

<body>

<header>CHU BINGO</header>

<div class="container">

  <!-- LOGIN -->
  <section id="login" class="screen active">
    <div class="card">

      <div class="ball">8</div>

      <h1>CHU<br>BINGO</h1>

      <p>
        Welcome to the new CHU Bingo
      </p>

      <input
        id="playerName"
        type="text"
        placeholder="Enter your name"
        maxlength="20"
      >

      <button onclick="login()">
        START
      </button>

    </div>
  </section>


  <!-- DASHBOARD -->
  <section id="dashboard" class="screen">

    <div class="card">

      <h1>CHU BINGO</h1>

      <p>
        Welcome, <strong id="welcomeName"></strong>
      </p>

      <div class="dashboard">

        <div class="stat">
          <small>Player ID</small>
          <strong id="playerId">CHU0001</strong>
        </div>

        <div class="stat">
          <small>Demo Balance</small>
          <strong>500 ETB</strong>
        </div>

      </div>

      <button onclick="startGame()">
        GET BINGO CARD
      </button>

      <button class="secondary" onclick="logout()">
        LOGOUT
      </button>

    </div>

  </section>


  <!-- GAME -->
  <section id="game" class="screen">

    <div class="game">

      <h2 style="text-align:center;">
        CHU BINGO GAME
      </h2>

      <div class="current">
        <p>Current Number</p>
        <span id="currentNumber">—</span>
      </div>

      <button onclick="callNumber()">
        CALL NUMBER
      </button>

      <div class="columns">
        <div>B</div>
        <div>I</div>
        <div>N</div>
        <div>G</div>
        <div>O</div>
      </div>

      <div id="bingoCard" class="bingo"></div>

      <div id="message" class="message"></div>

      <button class="secondary" onclick="newCard()">
        NEW CARD
      </button>

      <button class="secondary" onclick="backDashboard()">
        DASHBOARD
      </button>

    </div>

  </section>

  <div class="footer">
    CHU Bingo
  </div>

</div>


<script>

let player = "";
let numbersCalled = [];
let cardNumbers = [];

function showScreen(id){

  document.querySelectorAll(".screen").forEach(function(screen){
    screen.classList.remove("active");
  });

  document.getElementById(id).classList.add("active");
}


function login(){

  const input = document.getElementById("playerName");
  const name = input.value.trim();

  if(!name){
    alert("Please enter your name.");
    return;
  }

  player = name;

  document.getElementById("welcomeName").textContent = player;

  document.getElementById("playerId").textContent =
    "CHU" + Math.floor(100000 + Math.random()*900000);

  showScreen("dashboard");
}


function logout(){

  player = "";
  document.getElementById("playerName").value = "";

  showScreen("login");
}


function startGame(){

  newCard();
  showScreen("game");

}


function backDashboard(){

  showScreen("dashboard");

}


function shuffle(array){

  for(let i=array.length-1;i>0;i--){

    const j=Math.floor(Math.random()*(i+1));

    [array[i],array[j]]=[array[j],array[i]];

  }

  return array;
}


function createColumn(min,max){

  const numbers=[];

  for(let n=min;n<=max;n++){
    numbers.push(n);
  }

  shuffle(numbers);

  return numbers.slice(0,5);

}


function newCard(){

  numbersCalled=[];

  document.getElementById("currentNumber").textContent="—";

  document.getElementById("message").textContent="";

  const B=createColumn(1,15);
  const I=createColumn(16,30);
  const N=createColumn(31,45);
  const G=createColumn(46,60);
  const O=createColumn(61,75);

  cardNumbers=[];

  for(let row=0;row<5;row++){

    cardNumbers.push([
      B[row],
      I[row],
      N[row],
      G[row],
      O[row]
    ]);

  }

  cardNumbers[2][2]="FREE";

  drawCard();

}


function drawCard(){

  const board=document.getElementById("bingoCard");

  board.innerHTML="";

  for(let row=0;row<5;row++){

    for(let col=0;col<5;col++){

      const cell=document.createElement("div");

      cell.className="cell";

      const value=cardNumbers[row][col];

      cell.textContent=value;

      if(value==="FREE"){
        cell.classList.add("free");
        cell.classList.add("marked");
      }

      cell.onclick=function(){

        if(value!=="FREE"){
          cell.classList.toggle("marked");
        }

        checkBingo();

      };

      board.appendChild(cell);

    }

  }

}


function callNumber(){

  if(numbersCalled.length>=75){

    document.getElementById("message").textContent =
      "All numbers have been called.";

    return;
  }

  let number;

  do{

    number=Math.floor(Math.random()*75)+1;

  }while(numbersCalled.includes(number));

  numbersCalled.push(number);

  document.getElementById("currentNumber").textContent=number;

  highlightNumber(number);

  checkBingo();

}


function highlightNumber(number){

  const cells=document.querySelectorAll(".cell");

  cells.forEach(function(cell){

    if(Number(cell.textContent)===number){

      cell.classList.add("marked");

    }

  });

}


function checkBingo(){

  const cells=document.querySelectorAll(".cell");

  const marked=[];

  cells.forEach(function(cell){

    marked.push(
      cell.classList.contains("marked")
    );

  });


  for(let row=0;row<5;row++){

    let complete=true;

    for(let col=0;col<5;col++){

      if(!marked[row*5+col]){
        complete=false;
      }

    }

    if(complete){
      win();
      return;
    }

  }


  for(let col=0;col<5;col++){

    let complete=true;

    for(let row=0;row<5;row++){

      if(!marked[row*5+col]){
        complete=false;
      }

    }

    if(complete){
      win();
      return;
    }

  }


  let diagonal1=true;
  let diagonal2=true;

  for(let i=0;i<5;i++){

    if(!marked[i*5+i]){
      diagonal1=false;
    }

    if(!marked[i*5+(4-i)]){
      diagonal2=false;
    }

  }


  if(diagonal1 || diagonal2){
    win();
  }

}


function win(){

  document.getElementById("message").textContent =
    "🎉 BINGO! Congratulations " + player + "!";

}

</script>

</body>
</html>
